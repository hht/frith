# PROTOTYPE spike — throwaway. Answers: can Rust + winit + skia-safe + libghostty-vt
# deliver a fast, fully TUI-capable terminal with in-window backdrop blur?
[package]
name = "spike-skia-ghostty"
version = "0.0.0"
edition = "2024"
publish = false

[features]
textlayout = ["skia-safe/textlayout"]

[dependencies]
winit = "=0.31.0-beta.4"
skia-safe = { version = "=0.157.0", features = ["metal", "ganesh"] }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "cd4d497e8c698b27054a677ce19d1bd1a1a4d8bf" }
portable-pty = "0.9"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-app-kit = "0.3"
raw-window-handle = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
