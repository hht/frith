[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
