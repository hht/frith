# Terminal sessions: a child process on a PTY, its libghostty-vt terminal, input encoding and
# shell integration. No GPU, drawing, or layout, so its tests build without Skia.
[package]
name = "frith-term"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
frith-core = { path = "../core" }
winit = "=0.31.0-beta.4"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "cd4d497e8c698b27054a677ce19d1bd1a1a4d8bf" }
libc = "0.2.191"

[lints]
workspace = true
